<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Struk Service - </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        padding: 0px;
        margin: 0 auto;
      }

      h1,
      h2,
      h3,
      h4,
      h5 {
        padding: 0px;
        margin: 0px;
      }

      p {
        padding: 0px;
        margin: 0px;
      }

      .text-left {
        text-align: left;
      }

      .text-center {
        text-align: center;
      }

      .text-right {
        text-align: right;
      }

      .struk {
        font-family: "Courier Prime", monospace;
        font-size: 13.5px;
        line-height: 17px;
        white-space: normal;
        word-wrap: break-word;
        margin: 15px;
      }

      .header {
        /* width: 100%; */
        display: flex;
        justify-content: space-between;
      }

      .header .custom-logo {
        display: flex;
        gap: 5px;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      .struk .logo {
        width: 80px;
        margin-bottom: 5px;
      }

      .struk.landscape {
        width: 680px !important;
      }

      .struk .top {
        margin-bottom: 22px;
      }

      .struk .field-item {
        display: flex;
        align-items: flex-start;
      }

      .struk .field-item span.item-label {
        flex: 1;
        text-transform: uppercase;
      }

      .struk .field-item span.item-value {
        flex: 2;
        display: flex;
      }

      .struk .field-value {
        display: flex;
        justify-content: space-between;
        width: 100%;
        overflow-wrap: anywhere;
        margin-left: 5px;
      }

      .struk .field-landscape {
        display: flex;
      }

      .struk .field-landscape .left,
      .struk .field-landscape .right {
        flex: 1;
      }

      .struk .bottom {
        margin-top: 22px;
      }

      .struk .currency {
        margin-right: 100px;
      }

      .struk .empty {
        line-height: 7px;
      }
    </style>
    <style>
      @media print {
        @page {
          margin: 0
        }

        body {
          background: #fff;
          -webkit-print-color-adjust: exact;
        }
      }
    </style>
    <style>
      @media print {
        .struk {
          font-size: 13.5px;
          width: 8.26in;
          line-height: 14px;
          word-break: break-word;
        }
      }
    </style>
    <style>
      .struk {
        page-break-after: always;
        /* setiap div struk akan pindah ke halaman baru */
      }

      .struk:last-child {
        page-break-after: auto;
        /* div terakhir tidak bikin halaman kosong tambahan */
      }
    </style>
  </head>
  <body>
    <script>


      (async () => {
        const params = new URLSearchParams(window.location.search);
        if(!params.has("ids")){
          alert("Tidak ada transaksi")
          return;
        }
        
        const ids = JSON.parse(atob(params.get("ids"))).reverse()

        let data = []
        await Promise.all(
          ids.map(async (id) => {
            const res = await fetch(`https://mpdesktop.fastpay.co.id/fp_web_struk_service/index.php/service?outlet=FA58456&id=${id}`);  // use current url
            const text = await res.text();
      
            const parser = new DOMParser();
            const doc = parser.parseFromString(text, "text/html");
            data[id] = struk = doc.querySelector("div.struk").outerHTML ?? null
          })
        );

        ids.map(item => {
          document.body.innerHTML += data[item]
        })

        alert("Loading Selesai");
      })();
      
      
    </script>
  </body>
</html>
